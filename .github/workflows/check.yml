name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-tk shellcheck desktop-file-utils rpm
      - run: make check
      - run: shellcheck src/battery-threshold-helper src/battery-threshold-restore install.sh uninstall.sh services/battery-threshold.sysv
      - run: desktop-file-validate data/battery-threshold.desktop
      - run: make deb rpm
      - uses: actions/upload-artifact@v4
        with:
          name: battery-threshold-packages
          path: |
            dist/*.deb
            build/rpmbuild/RPMS/noarch/*.rpm
